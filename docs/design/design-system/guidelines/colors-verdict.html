<!-- @dsCard group="Colors" viewport="700x150" subtitle="pass / partial / gap / fail — Gap is violet, never confused with Fail" name="Verdict palette" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-1)}.w{flex:1;display:flex;flex-direction:column;gap:0;border:1px solid var(--line-1);border-radius:var(--radius-2);overflow:hidden}.top{height:44px;display:flex;align-items:center;justify-content:center;color:#fff;font:600 13px var(--font-mono)}.bot{padding:8px 10px;font:10.5px var(--font-mono)}</style></head><body>
<div style="display:flex;gap:10px;padding:18px 20px">
  <div class="w"><div class="top" style="background:var(--pass)">pass</div><div class="bot" style="background:var(--pass-wash);color:var(--pass)">--pass · rule holds</div></div>
  <div class="w"><div class="top" style="background:var(--partial)">partial</div><div class="bot" style="background:var(--partial-wash);color:var(--partial)">--partial · holds with holes</div></div>
  <div class="w"><div class="top" style="background:var(--gap)">gap</div><div class="bot" style="background:var(--gap-wash);color:var(--gap)">--gap · nothing governs this</div></div>
  <div class="w"><div class="top" style="background:var(--fail)">fail</div><div class="bot" style="background:var(--fail-wash);color:var(--fail)">--fail · rule fails the test</div></div>
</div>
</body></html>
