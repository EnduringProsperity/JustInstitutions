<!-- @dsCard group="Spacing & Shape" viewport="700x160" subtitle="Small radii, 1px borders, whisper shadows — hierarchy from borders, not elevation" name="Shape & elevation" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-0);color:var(--ink-1)}.c{background:var(--bg-1);padding:12px 14px;font:12px var(--font-sans)}.v{font:10px var(--font-mono);color:var(--ink-3);display:block;margin-top:6px}</style></head><body>
<div style="display:flex;gap:14px;padding:20px 22px">
  <div class="c" style="border:1px solid var(--line-1);border-radius:var(--radius-1);flex:1">chip / badge<span class="v">--radius-1 · 3px</span></div>
  <div class="c" style="border:1px solid var(--line-1);border-radius:var(--radius-2);box-shadow:var(--shadow-1);flex:1">button / input<span class="v">--radius-2 · 6px · shadow-1</span></div>
  <div class="c" style="border:1px solid var(--line-1);border-radius:var(--radius-3);box-shadow:var(--shadow-2);flex:1">card / panel<span class="v">--radius-3 · 10px · shadow-2</span></div>
  <div class="c" style="border:1px solid var(--line-1);border-radius:var(--radius-3);box-shadow:var(--shadow-pop);flex:1">popover / dialog<span class="v">--shadow-pop</span></div>
</div>
</body></html>
