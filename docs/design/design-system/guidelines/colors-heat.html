<!-- @dsCard group="Colors" viewport="700x150" subtitle="Severity ramp for scorecards & heat maps" name="Heat ramp" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-1)}</style></head><body>
<div style="padding:20px">
  <div style="display:flex;border-radius:var(--radius-2);overflow:hidden;border:1px solid var(--line-1)">
    <div style="flex:1;height:56px;background:var(--heat-1)"></div><div style="flex:1;height:56px;background:var(--heat-2)"></div><div style="flex:1;height:56px;background:var(--heat-3)"></div><div style="flex:1;height:56px;background:var(--heat-4)"></div><div style="flex:1;height:56px;background:var(--heat-5)"></div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font:10.5px var(--font-mono);color:var(--ink-3);letter-spacing:var(--tracking-caps)"><span>--heat-1 · SOUND</span><span>--heat-3</span><span>--heat-5 · CRITICAL</span></div>
</div>
</body></html>
