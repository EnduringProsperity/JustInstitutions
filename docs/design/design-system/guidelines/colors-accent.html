<!-- @dsCard group="Colors" viewport="700x150" subtitle="Civic blue accent + interaction states" name="Accent" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-1)}</style></head><body>
<div style="display:flex;gap:12px;padding:18px 20px;align-items:stretch">
  <div style="flex:1.4;border-radius:var(--radius-2);background:var(--accent);color:var(--on-accent);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:600 13px var(--font-sans)">--accent</span><span style="font:11px var(--font-mono)">oklch(51% .14 255)</span></div>
  <div style="flex:1;border-radius:var(--radius-2);background:var(--accent-strong);color:var(--on-accent);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:600 13px var(--font-sans)">--accent-strong</span><span style="font:11px var(--font-mono)">press / hover</span></div>
  <div style="flex:1;border-radius:var(--radius-2);background:var(--accent-wash);border:1px solid var(--accent-line);color:var(--accent-strong);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:600 13px var(--font-sans)">--accent-wash</span><span style="font:11px var(--font-mono)">selection / chips</span></div>
  <div style="flex:1;border-radius:var(--radius-2);background:var(--bg-2);border:2px solid var(--focus-ring);color:var(--ink-1);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:600 13px var(--font-sans)">--focus-ring</span><span style="font:11px var(--font-mono)">2px, offset 2</span></div>
</div>
</body></html>
