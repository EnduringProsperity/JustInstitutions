<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-1)}.b{flex:1;border-radius:var(--radius-2);color:#fff;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:78px}.t{font:600 13px var(--font-mono)}.l{font:11px var(--font-sans);opacity:.9}</style></head><body>
<div style="display:flex;gap:10px;padding:18px 20px;align-items:stretch">
  <div class="b" style="background:var(--conf-0)"><span class="t">C0</span><span class="l">Gap — "no rule governs this"</span></div>
  <div class="b" style="background:var(--conf-1)"><span class="t">C1</span><span class="l">Association — "moves together with"</span></div>
  <div class="b" style="background:var(--conf-2)"><span class="t">C2</span><span class="l">Supported — "evidence supports a link"</span></div>
  <div class="b" style="background:var(--conf-3)"><span class="t">C3</span><span class="l">Strong — "strong association"</span></div>
</div>
</body></html>
