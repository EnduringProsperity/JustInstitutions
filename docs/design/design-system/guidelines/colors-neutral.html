<!-- @dsCard group="Colors" viewport="700x170" subtitle="Cool ink ramp, washes, borders, dark panel" name="Neutrals" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--bg-1)}.s{flex:1;border-radius:var(--radius-1);padding:9px 10px;display:flex;flex-direction:column;justify-content:space-between;min-height:52px}.n{font:600 12px var(--font-sans)}.v{font:10px var(--font-mono)}</style></head><body>
<div style="padding:16px 20px;display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;gap:8px">
    <div class="s" style="background:var(--bg-0);border:1px solid var(--line-2)"><span class="n">--bg-0</span><span class="v" style="color:var(--ink-3)">page</span></div>
    <div class="s" style="background:var(--bg-1);border:1px solid var(--line-1)"><span class="n">--bg-1</span><span class="v" style="color:var(--ink-3)">card</span></div>
    <div class="s" style="background:var(--bg-2)"><span class="n">--bg-2</span><span class="v" style="color:var(--ink-3)">inset</span></div>
    <div class="s" style="background:var(--bg-3)"><span class="n">--bg-3</span><span class="v" style="color:var(--ink-3)">hover</span></div>
    <div class="s" style="background:var(--ink-surface);color:var(--on-ink)"><span class="n">--ink-surface</span><span class="v" style="color:var(--on-ink-dim)">exec panels</span></div>
  </div>
  <div style="display:flex;gap:8px">
    <div class="s" style="background:var(--ink-1);color:#fff"><span class="n">--ink-1</span><span class="v" style="opacity:.7">text</span></div>
    <div class="s" style="background:var(--ink-2);color:#fff"><span class="n">--ink-2</span><span class="v" style="opacity:.75">secondary</span></div>
    <div class="s" style="background:var(--ink-3);color:#fff"><span class="n">--ink-3</span><span class="v" style="opacity:.8">tertiary</span></div>
    <div class="s" style="background:var(--line-1)"><span class="n">--line-1</span><span class="v" style="color:var(--ink-2)">borders</span></div>
    <div class="s" style="background:var(--line-2)"><span class="n">--line-2</span><span class="v" style="color:var(--ink-2)">hairlines</span></div>
  </div>
</div>
</body></html>
