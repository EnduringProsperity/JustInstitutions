name: Deploy prototype to GitHub Pages

# Publishes docs/design/screens/ (the mock-data design prototype) to
# GitHub Pages. Requires the repo to be public and Pages enabled with
# source = "GitHub Actions" (Settings -> Pages).

on:
  push:
    branches: [main]
    paths:
      - "docs/design/screens/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/design/screens
      - id: deployment
        uses: actions/deploy-pages@v4
